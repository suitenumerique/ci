name: Build and Push Container Image

"on":
  workflow_call:
    inputs:
      image_name:
        type: string
        required: true
        description: The suffix for the image name, without the registry and without the repository path.
      context:
        type: string
        required: true
        description: The path to the context to start `docker build` into.
      file:
        type: string
        required: true
        description: The path to the Dockerfile
      target:
        type: string
        required: false
        default: ""
        description: The Dockerfile target stage to build the image for.
      should_push:
        type: boolean
        required: false
        default: false
        description: if the image should be pushed on the docker registry
      docker_user:
        type: string
        required: false
        default: ""
        description: The docker_user ARGUMENT to pass to the build step
      is_multi_platform:
        type: boolean
        required: false
        default: true
        description: Build for linux/amd64 and linux/arm64 when true, linux/amd64 only when false
      trivy_scan:
        type: boolean
        required: false
        default: true
        description: >-
          Scan the image with Trivy before pushing it, failing on HIGH or CRITICAL
          vulnerabilities. Pass e.g. vars.TRIVY_SCAN_ENABLED == 'true' to control it per repository.
      trivy_ignore_files:
        type: string
        required: false
        default: ""
        description: >-
          Comma-separated .trivyignore files of the calling repository to use
          (e.g. "./.github/.trivyignore"). A .trivyignore at the repository root
          is used by Trivy even without it.
    secrets:
      DOCKER_HUB_USER:
        required: true
      DOCKER_HUB_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUILD_PLATFORMS: ${{ inputs.is_multi_platform && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up QEMU
        if: ${{ inputs.is_multi_platform }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Login to DockerHub
        if: ${{ inputs.should_push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ inputs.image_name }}
      - name: Run trivy scan
        if: ${{ inputs.trivy_scan }}
        uses: suitenumerique/ci/actions/trivy-cache@main # zizmor: ignore[unpinned-uses] same repository
        with:
          docker-build-args: >-
            -f ${{ inputs.file }}
            ${{ inputs.target != '' && format('--target {0}', inputs.target) || '' }}
            --build-arg DOCKER_USER=${{ inputs.docker_user }}
            --build-arg PUBLISH_AS_MIT=false
          docker-image-name: "docker.io/${{ inputs.image_name }}:${{ github.sha }}"
          docker-context: ${{ inputs.context }}
          trivyignores: ${{ inputs.trivy_ignore_files }}
      - name: Build and push
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: ${{ env.BUILD_PLATFORMS }}
          build-args: |
            DOCKER_USER=${{ inputs.docker_user }}
            PUBLISH_AS_MIT=false
          push: ${{ inputs.should_push }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Cleanup Docker after build
        if: always()
        run: |
          docker system prune -af
          docker volume prune -f
