name: Python lint

"on":
  workflow_call:
    inputs:
      working_directory:
        type: string
        required: false
        default: src/backend
        description: Directory of the Python project (where pyproject.toml and uv.lock live)
      python_version:
        type: string
        required: false
        default: ""
        description: Python version to use; empty reads requires-python from the project's pyproject.toml
      uv_sync_args:
        type: string
        required: false
        default: --locked --all-extras
        description: Arguments passed to `uv sync`
      apt_packages:
        type: string
        required: false
        default: ""
        description: Space-separated system packages needed to install the project (e.g. "libxml2-dev libxslt-dev")
      ruff_format:
        type: boolean
        required: false
        default: true
        description: Check formatting with `ruff format --diff`
      ruff_check:
        type: boolean
        required: false
        default: true
        description: Lint with `ruff check`
      pylint_targets:
        type: string
        required: false
        default: ""
        description: Space-separated modules/paths for pylint; empty skips pylint
      extra_command:
        type: string
        required: false
        default: ""
        description: Extra command run with `uv run` after the linters (e.g. "mypy ." or "pyright")

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system packages
        if: inputs.apt_packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt_packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python_version }}
          python-version-file: ${{ inputs.python_version == '' && format('{0}/pyproject.toml', inputs.working_directory) || '' }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install the project
        id: sync
        env:
          UV_SYNC_ARGS: ${{ inputs.uv_sync_args }}
        run: |
          uv sync $UV_SYNC_ARGS

      - name: Check code formatting with ruff
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && inputs.ruff_format }}
        run: uv run --no-sync ruff format . --diff

      - name: Lint code with ruff
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && inputs.ruff_check }}
        run: uv run --no-sync ruff check .

      - name: Lint code with pylint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && inputs.pylint_targets != '' }}
        env:
          PYLINT_TARGETS: ${{ inputs.pylint_targets }}
        run: |
          uv run --no-sync pylint $PYLINT_TARGETS

      - name: Run extra check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && inputs.extra_command != '' }}
        env:
          EXTRA_COMMAND: ${{ inputs.extra_command }}
        run: |
          uv run --no-sync $EXTRA_COMMAND
