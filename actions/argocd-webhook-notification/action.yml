name: 'Argocd webhook notify'
description: 'This action send a github notification to argocd'
inputs:
  deployment_repo_path:
    description: 'The deployment repo path (ex: numerique-gouv/action-argocd-webhook-notification)'
    required: true
  argocd_webhook_secret:
    description: 'The argocd webhook secret (value of webhook.github.secret in argocd helm chart)'
    required: true
  argocd_url:
    description: 'The argocd url'
    required: true
runs:
  using: "composite"
  steps:
    -
      name: Notify argocd
      shell: bash
      env:
        DEPLOYMENT_REPO_PATH: ${{ inputs.deployment_repo_path }}
        ARGOCD_WEBHOOK_SECRET: ${{ inputs.argocd_webhook_secret }}
        ARGOCD_URL: ${{ inputs.argocd_url }}
      run: |
        data='{"ref": "'"${GITHUB_REF}"'","repository": {"html_url":"'"${GITHUB_SERVER_URL}/${DEPLOYMENT_REPO_PATH}"'"}}'
        sig=$(printf '%s' "${data}" | openssl dgst -sha256 -hmac "${ARGOCD_WEBHOOK_SECRET}" | awk '{print "X-Hub-Signature-256: sha256="$2}')
        curl -X POST -H 'X-GitHub-Event:push' -H "Content-Type: application/json" -H "${sig}" --data "${data}" "${ARGOCD_URL}/api/webhook"
