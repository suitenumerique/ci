name: 'Trivy image scan'
description: 'Build a Docker image and scan it with Trivy for HIGH and CRITICAL vulnerabilities'
inputs:
  docker-build-args:
    description: 'The docker build args without -t'
    required: true
  docker-image-name:
    description: 'The docker image name'
    required: true
  docker-context:
    description: 'The docker build context path'
    required: false
    default: '.'
  trivyignores:
    description: 'Comma-separated list of .trivyignore files to use'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    -
      name: Build an image from Dockerfile
      shell: bash
      env:
        DOCKER_BUILD_ARGS: ${{ inputs.docker-build-args }}
        DOCKER_IMAGE_NAME: ${{ inputs.docker-image-name }}
        BUILD_CONTEXT: ${{ inputs.docker-context }}
      run: |
        # The build args are a list of options, split on purpose
        # shellcheck disable=SC2086
        docker build ${DOCKER_BUILD_ARGS} -t "${DOCKER_IMAGE_NAME}" "${BUILD_CONTEXT}"
    -
      name: Get Date
      id: get-date
      shell: bash
      run: |
        echo "date=$(/bin/date -u "+%Y%m%d")" >> "${GITHUB_OUTPUT}"
    -
      name: Restore trivy cache
      id: trivy-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: trivy
        key: ${{ steps.get-date.outputs.date }}
    -
      name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
      with:
        image-ref: "${{ inputs.docker-image-name }}"
        format: 'table'
        exit-code: '1'
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        cache-dir: trivy
        trivyignores: ${{ inputs.trivyignores }}
    -
      name: Fix trivy cache folder permission
      if: always()
      shell: bash
      run: |
        # Let the runner user save the cache, whatever user wrote it
        if [ -d trivy ]; then
          sudo chown -R "$(id -u):$(id -g)" trivy
        fi
    -
      name: Save trivy cache
      if: always() && steps.trivy-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: trivy
        key: ${{ steps.trivy-cache.outputs.cache-primary-key }}
